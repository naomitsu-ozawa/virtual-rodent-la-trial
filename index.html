    <script>try{var t=localStorage.getItem('vrl-theme');t=({'light-cool':'light-gray','dark-navy':'dark-gray'})[t]||t;if(!/^(light|dark)-[a-z]+$/.test(t||''))t=matchMedia('(prefers-color-scheme: light)').matches?'light-standard':'dark-standard';document.documentElement.dataset.theme=t;document.documentElement.dataset.themeMode=t.indexOf('light')===0?'light':'dark'}catch(e){}</script>

    <link rel="stylesheet" href="/docs/style.css" />
