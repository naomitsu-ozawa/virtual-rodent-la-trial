<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR check</title>
<style>
 body{margin:0;padding:16px;background:#111;color:#eee;font:16px/1.5 system-ui,sans-serif}
 h1{font-size:20px;margin:0 0 12px}
 table{border-collapse:collapse;width:100%;max-width:900px}
 td{border-bottom:1px solid #333;padding:6px 8px;vertical-align:top}
 td:first-child{color:#aaa;width:38%}
 .ok{color:#7ddc7d}.ng{color:#ff8080}.na{color:#e0c060}
 button{font-size:18px;padding:10px 16px;margin:12px 8px 0 0;border-radius:8px;border:0;background:#2d6cdf;color:#fff}
 button:disabled{background:#555}
 pre{white-space:pre-wrap;background:#1c1c1c;padding:10px;border-radius:8px;max-width:900px}
</style>
</head>
<body>
<h1>VR 対応チェック</h1>
<p>Quest のブラウザでこのページを開き、下の表と 2 つのボタンの結果を送ってください。</p>
<table id="t"></table>
<button id="vr-webgl" disabled>VR テスト（WebGL2）</button>
<button id="vr-webgpu" disabled>VR テスト（WebGPU）</button>
<button id="copy">結果をコピー</button>
<pre id="log"></pre>
<script type="module">
const rows=[],t=document.getElementById('t'),logEl=document.getElementById('log');
const log=s=>{logEl.textContent+=s+'\n'};
const row=(k,v,cls)=>{rows.push(k+': '+v);const tr=document.createElement('tr');tr.innerHTML='<td></td><td></td>';tr.children[0].textContent=k;tr.children[1].textContent=v;if(cls)tr.children[1].className=cls;t.append(tr)};
row('userAgent',navigator.userAgent);
row('deviceMemory (GB, rough)',String(navigator.deviceMemory??'—'));
row('hardwareConcurrency',String(navigator.hardwareConcurrency??'—'));
// WebGPU
let device=null;
if(!navigator.gpu)row('WebGPU','なし','ng');
else{
 try{
  const a=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
  if(!a)row('WebGPU','adapter なし','ng');
  else{
   const info=a.info||{};row('WebGPU','あり','ok');
   row('GPU',[info.vendor,info.architecture,info.device,info.description].filter(Boolean).join(' / ')||'—');
   row('maxBufferSize',(a.limits.maxBufferSize/2**20).toFixed(0)+' MB');
   row('maxStorageBufferBindingSize',(a.limits.maxStorageBufferBindingSize/2**20).toFixed(0)+' MB');
   row('maxTextureDimension3D',String(a.limits.maxTextureDimension3D));
   device=await a.requestDevice().catch(e=>{row('WebGPU device','失敗: '+e.message,'ng');return null});
  }
 }catch(e){row('WebGPU','エラー: '+e.message,'ng')}
}
// WebXR
let vr=false;
if(!navigator.xr)row('WebXR','なし','ng');
else{
 vr=await navigator.xr.isSessionSupported('immersive-vr').catch(()=>false);
 row('WebXR immersive-vr',vr?'対応':'非対応',vr?'ok':'ng');
 const ar=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
 row('WebXR immersive-ar',ar?'対応':'非対応',ar?'ok':'na');
}
const hasBinding=typeof globalThis.XRGPUBinding==='function';
row('XRGPUBinding (WebGPU→VR)',hasBinding?'あり':'なし',hasBinding?'ok':'na');
row('XRWebGLLayer (WebGL→VR)',typeof globalThis.XRWebGLLayer==='function'?'あり':'なし',typeof globalThis.XRWebGLLayer==='function'?'ok':'ng');
const bW=document.getElementById('vr-webgl'),bG=document.getElementById('vr-webgpu');
bW.disabled=!vr;bG.disabled=!(vr&&hasBinding&&device);

async function run(kind){
 log('--- '+kind+' ---');
 try{
  const opts=kind==='webgpu'?{requiredFeatures:['webgpu']}:{};
  const session=await navigator.xr.requestSession('immersive-vr',opts);
  log('session: ok');
  const ref=await session.requestReferenceSpace('local');
  let frames=0,first=0,last=0;
  if(kind==='webgl'){
   const canvas=document.createElement('canvas'),gl=canvas.getContext('webgl2',{xrCompatible:true});
   if(!gl)throw new Error('WebGL2 context failed');
   await gl.makeXRCompatible?.();
   session.updateRenderState({baseLayer:new XRWebGLLayer(session,gl)});
   const draw=(time,frame)=>{frames++;if(!first)first=time;last=time;const layer=session.renderState.baseLayer;gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.clearColor(0.1,0.4,0.2,1);gl.clear(gl.COLOR_BUFFER_BIT);frame.getViewerPose(ref);session.requestAnimationFrame(draw)};
   session.requestAnimationFrame(draw);
  }else{
   const binding=new XRGPUBinding(session,device),format=binding.getPreferredColorFormat?.()||'rgba8unorm';
   const layer=binding.createProjectionLayer({colorFormat:format});
   session.updateRenderState({layers:[layer]});
   log('projection layer: '+format);
   const draw=(time,frame)=>{frames++;if(!first)first=time;last=time;const pose=frame.getViewerPose(ref);const enc=device.createCommandEncoder();
    for(const view of pose?.views||[]){const sub=binding.getViewSubImage(layer,view);const pass=enc.beginRenderPass({colorAttachments:[{view:sub.colorTexture.createView(sub.getViewDescriptor?.()),loadOp:'clear',storeOp:'store',clearValue:{r:0.1,g:0.2,b:0.5,a:1}}]});pass.end()}
    device.queue.submit([enc.finish()]);session.requestAnimationFrame(draw)};
   session.requestAnimationFrame(draw);
  }
  await new Promise(r=>setTimeout(r,5000));
  await session.end().catch(()=>{});
  const fps=frames>1?(frames-1)/((last-first)/1000):0;
  log('frames: '+frames+' · '+fps.toFixed(0)+' fps');
  rows.push(kind+' VR: ok, '+fps.toFixed(0)+' fps');
 }catch(e){log('失敗: '+(e?.message||e));rows.push(kind+' VR: 失敗 '+(e?.message||e))}
}
bW.onclick=()=>run('webgl');bG.onclick=()=>run('webgpu');
document.getElementById('copy').onclick=async()=>{const text=rows.join('\n')+'\n'+logEl.textContent;try{await navigator.clipboard.writeText(text);log('(コピーしました)')}catch{log('コピーできません。画面の文字を送ってください。')}};
</script>
</body>
</html>
