name: Pages

# Publishes the site from the gh-pages branch:
# - push to main       -> docs/ deployed to the site root (production)
# - pull request       -> docs/ deployed to /pr-preview/pr-<N>/ and the URL is
#                         posted as a PR comment; removed when the PR closes
# This replaces committing docs/preview-NNN/ snapshot folders to main: open a
# PR and check the preview URL on a real device (iPad/Mac with WebGPU).
#
# Requires Settings > Pages > Source: "Deploy from a branch", gh-pages / (root).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write        # push to gh-pages
  pull-requests: write   # preview link comment

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production:
    name: Deploy main to site root
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: docs
          branch: gh-pages
          clean-exclude: pr-preview/   # keep PR previews when main redeploys
          force: false                 # rebase instead of force-push (previews may land concurrently)

  preview:
    name: PR preview
    # Previews need a write token, which PRs from forks do not get.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The practice data (docs/demo, hundreds of MB) is NOT copied into previews: every preview
      # would add it to gh-pages and the published site would exceed the 1 GB Pages limit.
      # The preview app reads it from the main site's /demo/ instead (docs/sample-config.js flag,
      # set to true in the copy below). Exception: a PR that changes files under docs/demo keeps
      # docs/demo in its preview (flag stays false), so a new or edited sample can be tested
      # before it reaches main. docs/ itself is never modified; only the copy is.
      - name: Prepare preview site
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          site="$RUNNER_TEMP/preview-site"
          if gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename' | grep -q '^docs/demo/'; then
            echo "PR changes docs/demo: keeping it in the preview"
            cp -a docs "$site"
          else
            echo "docs/demo unchanged: preview reads practice data from the site root"
            mkdir -p "$site"
            tar -C docs --exclude=./demo -cf - . | tar -C "$site" -xf -
            sed -i 's/DEMO_FROM_SITE_ROOT=false/DEMO_FROM_SITE_ROOT=true/' "$site/sample-config.js"
            grep -q 'DEMO_FROM_SITE_ROOT=true' "$site/sample-config.js"
          fi
          du -sh "$site"
      - uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: ${{ runner.temp }}/preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
