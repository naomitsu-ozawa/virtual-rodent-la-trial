name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Static checks + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (undefined references, duplicate declarations)
        run: npm run lint
      - run: npm test

  vr-guards:
    name: VR render guards (golden images, CPU/GPU parity, shader compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run vr-gpu-prepare-check
      - run: npm run vr-render-golden
      - run: npm run vr-cls-parity
      - run: npm run vr-depth-check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vr-golden-diff
          path: test-results/vr-golden/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test tests/e2e/smoke.spec.js tests/e2e/sample-project.spec.js tests/e2e/crop-export.spec.js tests/e2e/gpu-fallback.spec.js tests/e2e/settings-tabs.spec.js tests/e2e/smooth-workers.spec.js tests/e2e/vr-self-check.spec.js tests/e2e/trial-no-user-input.spec.js
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
